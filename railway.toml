# Default Railway config for the API service (tebbi-api).
# In Railway: link this file or leave as the repo config file path.
# For the Web UI service, use railway.web.toml instead (see docs/hosting.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
