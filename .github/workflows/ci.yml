# Runs the test projects that do not need the MAUI Android workload.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Application tests
        run: dotnet test tests/TebiDashboard.Application.Tests/TebiDashboard.Application.Tests.csproj --configuration Release --nologo

      - name: API tests
        run: dotnet test tests/TebiDashboard.Api.Tests/TebiDashboard.Api.Tests.csproj --configuration Release --nologo

      - name: Infrastructure tests
        run: dotnet test tests/TebiDashboard.Infrastructure.Tests/TebiDashboard.Infrastructure.Tests.csproj --configuration Release --nologo

      - name: UI tests
        run: dotnet test tests/TebiDashboard.UI.Tests/TebiDashboard.UI.Tests.csproj --configuration Release --nologo
